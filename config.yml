    rtol: {value: 1.0e-8, prov: placeholder, ref: "§7.5"}
    atol: {value: 1.0e-10, prov: placeholder, ref: "§7.5"}
    fastmath: {value: false, prov: locked, ref: "§7.5"}
    dtype: {value: "float64", prov: locked, ref: "§7.5, §16.5.2"}
    cholesky_convention: {value: "upper-triangular (SciPy default); rows of U are sigma-point offsets", prov: locked, ref: "§7.5", note: "verify against installed filterpy source"}

