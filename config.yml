  AB_product: {value: 71.5, prov: placeholder, ref: "§7.6", note: "A*B held at 3.25 * 22; A = sqrt(AB*rho), B = sqrt(AB/rho)"}
  m_mean: {value: 0.2, prov: placeholder, ref: "§7.6"}
  m_sd: {value: 0.15, prov: placeholder, ref: "§7.6"}
  m_truncate: {value: [0.0, 0.5], prov: placeholder, ref: "§7.6"}

