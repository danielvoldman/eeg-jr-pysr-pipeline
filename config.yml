  divergence:
    covariance_jitter: {value: 1.0e-9, prov: locked, ref: "§7.5"}
    state_sd_multiple: {value: 10, prov: locked, ref: "§7.5"}
    recording_fraction: {value: 0.10, prov: locked, ref: "§7.5"}
  parameter_estimate_from_smoothed_mean_after_burn_in: {value: true, prov: locked, ref: "§7.5"}
  numba:
