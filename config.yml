# config.yml
# Source of truth: PREREGISTRATION.md (planning document v0.6, 2026-09-27). Section numbers below refer to it.
#
# FORMAT. Every parameter is a leaf of the form:  name: {value: ..., prov: <tag>, ref: "§x.y"}
# An optional `unit:` or `note:` may be added. Code reads only `value`; `prov` and `ref` are the record.
# YAML NOTE. Write floats in exponent form with a dot (1.0e-4, never 1e-4), or PyYAML reads them as strings.
#
# PROVENANCE TAGS (prov)
#   literature   value taken from a published source (mainly §7.3, Jansen & Rit 1995)
#   locked       design decision tagged LOCKED in the document (or fixed by it without a separate tag)
#   placeholder  PLACEHOLDER default; the pilot may recalibrate it (Stage J in PLAN.md)
#   computed     produced by code and written back here (mu_ref, sigma_ref)
#   fitted       produced by fitting to data; nothing is fitted yet
#   unset        the document gives no value. Code must STOP AND ASK, then log the choice
#                in DEVIATIONS.md §2 and change this tag to `placeholder`.
#
# Changing a `locked` value needs a DEVIATIONS.md §1 entry. Finalizing a `placeholder` is logged in §3.

meta:
  source_document: "PREREGISTRATION.md"
  document_version: "v0.6"
  document_date: "2026-09-27"
  config_seeded: "2026-09-28"

# ---------------------------------------------------------------- repo layout (§18)
paths:
  data_dir: {value: "data", prov: locked, ref: "§18"}
  cache_dir: {value: "cache", prov: locked, ref: "§18"}
  outputs_dir: {value: "outputs", prov: locked, ref: "§18.1"}
  results_dir: {value: "results", prov: locked, ref: "§18.1"}
  figures_dir: {value: "results/figures", prov: locked, ref: "§18"}
  pilot_results_dir: {value: "results/pilot", prov: locked, ref: "§18.1"}
  logs_dir: {value: "logs", prov: locked, ref: "§18"}
  manifest_file: {value: "data/MANIFEST.sha256", prov: placeholder, ref: "§4.1, §18", note: "IMP-007"}
  download_log: {value: "logs/download.log", prov: placeholder, ref: "§18", note: "IMP-007"}
  gate_file: {value: "outputs/gate.json", prov: locked, ref: "§18.1"}
  summary_file: {value: "results/summary.json", prov: locked, ref: "§18.2"}
  equations_file: {value: "results/equations.tex", prov: locked, ref: "§18.2"}
  exclusions_file: {value: "outputs/exclusions.json", prov: placeholder, ref: "§12, §18.1", note: "IMP-012; written only by phase 1 (later), never by a test; per-variant files get a suffix"}
  split_file_pattern: {value: "outputs/split_{seed}.json", prov: locked, ref: "§11.1"}
  phase_flag_pattern: {value: "outputs/phase{n}.done", prov: locked, ref: "§18.1"}
  pilot_phase_flag_pattern: {value: "results/pilot/phase{n}.done", prov: placeholder, ref: "§18.1", note: "IMP-002: §18.1 does not say where pilot flags live; kept apart from outputs/ so a pilot never unlocks a full run"}

# ---------------------------------------------------------------- dataset (§4.1)
dataset:
  openneuro_id: {value: "ds003775", prov: locked, ref: "§4.1"}
  version: {value: "1.2.1", prov: locked, ref: "§4.1"}
  doi: {value: "10.18112/openneuro.ds003775.v1.2.1", prov: locked, ref: "§4.1"}
  n_subjects: {value: 111, prov: locked, ref: "§4.1"}
  n_subjects_with_t2: {value: 42, prov: locked, ref: "§4.1"}
  n_recordings: {value: 153, prov: locked, ref: "§4.1"}
  native_fs_hz: {value: 1024, prov: locked, ref: "§4.1"}
  recording_length_s: {value: 240, prov: locked, ref: "§4.1", note: "4 minutes, eyes closed"}
  line_freq_hz: {value: 50, prov: locked, ref: "§4.1"}
  read_units: {value: "uV", prov: locked, ref: "§4.2", note: "always units='uV' when reading EDF (mne-bids issue #1044)"}
  sub010_special_case: {value: "keep EEG, skip only scans.tsv", prov: locked, ref: "§4.2"}
  eeg_glob: {value: "sub-*/ses-*/eeg/*.edf", prov: placeholder, ref: "§4.1, §18", note: "IMP-007; recordings are found by this glob, never by name"}
  scans_glob: {value: "sub-*/ses-*/*_scans.tsv", prov: placeholder, ref: "§4.2", note: "IMP-007; expected count = n_recordings minus the skipped file"}
  subject_dir_glob: {value: "sub-*", prov: placeholder, ref: "§4.1", note: "IMP-007"}
  session_first: {value: "ses-t1", prov: placeholder, ref: "§4.1", note: "IMP-007"}
  session_second: {value: "ses-t2", prov: placeholder, ref: "§4.1", note: "IMP-007"}
  download_include: {value: ["/sub-*", "/code"], prov: placeholder, ref: "§4.2", note: "IMP-007; top-level files come in through openneuro-py's always-download rule; code/ is for reference only (s2_preprocess.m), not used by the pipeline"}
  download_exclude: {value: ["/derivatives"], prov: placeholder, ref: "§4.2", note: "IMP-007; derivative files are unsuitable"}
  edf_suffix: {value: "_eeg.edf", prov: placeholder, ref: "§4.2, §6", note: "IMP-009; channels.tsv sits next to the EDF with this suffix replaced"}
  channels_suffix: {value: "_channels.tsv", prov: placeholder, ref: "§4.2, §6", note: "IMP-009"}
  skip_scans_tsv: {value: {subject: "sub-010", session: "ses-t1", pattern: "*_scans.tsv"}, prov: locked, ref: "§4.2", note: "IMP-007; only this one scans.tsv is skipped, the EEG is downloaded"}

# ---------------------------------------------------------------- download.py settings (IMP-007)
download:
  min_free_space_factor: {value: 2, prov: placeholder, ref: "§18", note: "IMP-007; stop if free space is under this multiple of the total to fetch"}
  hash_chunk_bytes: {value: 1048576, prov: placeholder, ref: "§18", note: "IMP-007"}
  max_retries: {value: 5, prov: placeholder, ref: "§18", note: "IMP-007; openneuro-py default"}
  max_concurrent_downloads: {value: 5, prov: placeholder, ref: "§18", note: "IMP-007; openneuro-py default"}
  metadata_max_retries: {value: 3, prov: placeholder, ref: "§18", note: "IMP-007"}

# ---------------------------------------------------------------- preprocessing (§4.2, §5.1)
preprocessing:
  units_check:
    highpass_hz: {value: 0.5, prov: locked, ref: "§4.2"}
    channel_type: {value: "EEG", prov: placeholder, ref: "§4.2", note: "IMP-009; channels.tsv type column; status, trigger and other non-EEG channels are excluded"}
    median_sd_min_uv: {value: 2, prov: locked, ref: "§4.2"}
    median_sd_max_uv: {value: 200, prov: locked, ref: "§4.2"}
    halt_if_fail_fraction_above: {value: 0.05, prov: locked, ref: "§4.2"}
  channels:
    left_pair: {value: [P3, PO3], prov: locked, ref: "§6", note: "verify labels against channels.tsv before use"}
    right_pair: {value: [P4, PO4], prov: locked, ref: "§6"}
  bad_channel:
    rms_min_uv: {value: 1.0, prov: locked, ref: "§5.1", note: "doc writes ~5 and gives no status tag; treated as locked until told otherwise; changed from 5 by DEV-001"}
    rms_max_uv: {value: 150, prov: locked, ref: "§5.1", note: "doc writes ~150 and gives no status tag; treated as locked until told otherwise"}
    flatline_threshold: {value: 0.1, prov: placeholder, ref: "§5.1", unit: "uV", note: "IMP-009; a 1-s segment (rejection.segment_length_s) of the band-passed, edge-trimmed electrode whose peak-to-peak is below this is flat"}
    saturation_min_run_s: {value: 0.05, prov: placeholder, ref: "§5.1", unit: "s", note: "IMP-009; saturated if the RAW uV signal has a run of at least ceil(this * fs) consecutive samples exactly equal to the channel's own recording max or min. The header-range rule was unworkable: EDF physical min/max equal each channel's own data range in ds003775"}
  line_noise:
    method: {value: "standard notch filter", prov: locked, ref: "§5.1"}
    freq_hz: {value: 50, prov: locked, ref: "§5.1"}
    include_harmonics: {value: true, prov: locked, ref: "§5.1"}
    notch_q: {value: 30, prov: placeholder, ref: "§5.1", note: "IMP-009; quality factor of scipy.signal.iirnotch, applied zero-phase with filtfilt at freq_hz and every harmonic below Nyquist; fills the former unset notch_width"}
  bandpass:
    highpass_hz: {value: 0.5, prov: placeholder, ref: "§5.1"}
    lowpass_hz: {value: 45, prov: locked, ref: "§5.1", note: "no separate tag in the doc; treated as locked"}
    zero_phase: {value: true, prov: locked, ref: "§5.1", note: "no causal IIR filters"}
    filter_family: {value: "butterworth", prov: placeholder, ref: "§5.1", note: "IMP-004; SOS form, applied forward and backward with sosfiltfilt; nominal cutoffs are the -6 dB points of the combined filter"}
    filter_order: {value: 4, prov: placeholder, ref: "§5.1", note: "IMP-004; per pass, separately for the high-pass and the low-pass"}
    edge_pad_s: {value: 10, prov: placeholder, ref: "§5.1", note: "IMP-004; sosfiltfilt padlen = round(edge_pad_s * fs)"}
    edge_padtype: {value: "odd", prov: placeholder, ref: "§5.1", note: "IMP-004; sosfiltfilt padtype"}
    impulse_response_duration_s: {value: 120, prov: placeholder, ref: "§5.1", note: "IMP-004; length of the array returned by bandpass_impulse_response"}
  resample:
    pad_s: {value: 2, prov: placeholder, ref: "§5.1, §10.1", note: "IMP-004; reflect-pad before the FFT resample, rounded up to a multiple of the ratio"}
    reflect_type: {value: "odd", prov: placeholder, ref: "§5.1, §10.1", note: "IMP-004; numpy reflect_type for the resample pad"}
  ocular:
    method: {value: "wavelet", prov: placeholder, ref: "§5.1", note: "pilot may compare EMD"}
    detect_band_hz: {value: [0.5, 5.0], prov: placeholder, ref: "§5.1"}
    detect_threshold_robust_sd: {value: 6, prov: placeholder, ref: "§5.1", note: "MAD-based"}
    correct_window_s: {value: 0.25, prov: placeholder, ref: "§5.1", note: "+/- around each detected blink"}
    max_corrected_fraction: {value: 0.10, prov: placeholder, ref: "§12", note: "IMP-013; a recording is excluded (excessive_blink_correction) if the corrected time of EITHER bipolar channel exceeds this fraction of the edge-trimmed recording; the correction runs before the RMS upper-bound rule and could hide large slow artefacts"}
    report_corrected_fraction: {value: 0.05, prov: placeholder, ref: "§12", note: "IMP-013; print-only: --segment-report marks recordings whose corrected fraction is above this"}
    mad_to_sd_factor: {value: 1.4826, prov: literature, ref: "normal-distribution relation between MAD and SD: SD = MAD / Phi^-1(0.75), 1/Phi^-1(0.75) = 1.4826 (not from §5.1)", note: "IMP-012, IMP-013; robust SD = factor * MAD (consistent estimator of the SD of a Gaussian)"}
    wavelet:
      family: {value: "sym4", prov: placeholder, ref: "§5.1", note: "IMP-012; undecimated (stationary) wavelet transform, pywt.swt; the level (10 at 1024 Hz) and the altered detail levels (7 to 10) are derived from detect_band_hz and the sampling rate, not stored"}
      clip_multiplier_robust_sd: {value: 3, prov: placeholder, ref: "§5.1", note: "IMP-012; inside a correction window an altered coefficient is clipped to +/- this * (mad_to_sd_factor * MAD of that level over the whole channel)"}
      edge_pad_s: {value: 4, prov: placeholder, ref: "§5.1", unit: "s", note: "IMP-012, IMP-013; odd-reflect pad of ceil(edge_pad_s * fs) samples on both ends, plus a tail on the right so that the padded length is a multiple of 2**level; removed after the inverse"}
      reflect_type: {value: "odd", prov: placeholder, ref: "§5.1", note: "IMP-013; numpy reflect_type of the wavelet pad"}
  rejection:
    segment_length_s: {value: 1.0, prov: locked, ref: "§5.1"}
    emg_band_hz: {value: [70, 110], prov: locked, ref: "§5.1", note: "power computed BEFORE the low-pass"}
    emg_multiple_of_median: {value: 5, prov: placeholder, ref: "§5.1"}
    pad_s: {value: 0.5, prov: locked, ref: "§5.1", note: "each side of every rejected event; no separate tag in the doc"}
    min_clean_stretch_s: {value: 5, prov: placeholder, ref: "§5.1"}
    segment_rms_min_uv: {value: 1.0, prov: placeholder, ref: "§5.1, DEV-001", unit: "uV", note: "IMP-012; a 1-s segment of either bipolar channel with RMS below this is rejected; the upper bound is bad_channel.rms_max_uv (strict_variant.rms_max_uv)"}
    forbidden_tests: {value: [normality, kurtosis, lilliefors], prov: locked, ref: "§5.1"}
  edge_trim_s: {value: 5.0, prov: placeholder, ref: "§5.1", unit: "s", note: "IMP-009, raised from 1.0 by IMP-010; trimmed from BOTH ends after the band-pass (0.5 Hz high-pass)"}
  edge_trim_s_sensitivity_highpass: {value: 25.0, prov: placeholder, ref: "§5.1, §5.2", unit: "s", note: "IMP-009, raised from 10.0 by IMP-010 (15.0 was still too short on ten seeds, then 25.0); same, for the 0.1 Hz variant"}
  edge_report:
    seed: {value: 20260929, prov: placeholder, ref: "§5.1", note: "IMP-009; base seed of the development report, never used on data"}
    n_seeds: {value: 10, prov: placeholder, ref: "§5.1", note: "IMP-010; the 0.5 Hz variant runs seeds seed + 0 ... seed + n_seeds - 1"}
    n_seeds_slow: {value: 20, prov: placeholder, ref: "§5.1", note: "IMP-010; the 0.1 Hz variant runs seeds seed + 0 ... seed + n_seeds_slow - 1"}
    sine_hz: {value: 10, prov: placeholder, ref: "§5.1", note: "IMP-009"}
    sine_amplitude_uv: {value: 1.0, prov: placeholder, ref: "§5.1", note: "IMP-009"}
    noise_sd_uv: {value: 1.0, prov: placeholder, ref: "§5.1", note: "IMP-009; SD of the 1/f component"}
    noise_power_exponent: {value: 1.0, prov: placeholder, ref: "§5.1", note: "IMP-009; power spectrum proportional to f^-exponent"}
    margin_s: {value: 60, prov: placeholder, ref: "§5.1", unit: "s", note: "IMP-009; extra signal on each side, used to get the transient-free reference output"}
    max_deviation_fraction_of_sd: {value: 0.01, prov: placeholder, ref: "§5.1", note: "IMP-009; STOP if the deviation after the trim exceeds this fraction of the filtered signal SD"}
  electrode_diagnostics:
    alpha_band_hz: {value: [8, 13], prov: placeholder, ref: "§5.1", note: "IMP-010; read-only pilot diagnostic, never used to change a value"}
    total_band_hz: {value: [1, 45], prov: placeholder, ref: "§5.1", note: "IMP-010; denominator band of the relative alpha power; the periodogram segment length is simulator.sanity_welch_segment_s (same method as the IMP-005 alpha-peak diagnostic)"}
    segment_rms_percentiles: {value: [5, 25, 50, 75, 95], prov: placeholder, ref: "§5.1", note: "IMP-011; print-only bipolar 1-s segment RMS diagnostic for B5, pilot subjects only, never used to change a value"}
    segment_rms_reference_uv: {value: 5.0, prov: placeholder, ref: "§5.1", unit: "uV", note: "IMP-011; the pre-DEV-001 lower bound, kept only as a second reference level in the segment RMS diagnostic; the pipeline does not use it"}
  cache:
    subdir: {value: "preprocessed_b4", prov: placeholder, ref: "§18", note: "IMP-009; under paths.cache_dir"}
    subdir_b5: {value: "preprocessed_b5", prov: placeholder, ref: "§18", note: "IMP-012; under paths.cache_dir"}
    schema_version: {value: 2, prov: placeholder, ref: "§18", note: "IMP-012; part of every cache key; 2 = B4 result also stores the notched bipolar signal"}
  exclusions:
    schema_version: {value: 1, prov: placeholder, ref: "§12, §18.1", note: "IMP-013; schema number written into outputs/exclusions.json"}
  rescale:
    ddof: {value: 1, prov: placeholder, ref: "§5.1", note: "IMP-012, IMP-006(c); SD convention of the per-recording rescaling; must equal rescaling.reference_simulation.ddof (tested)"}
  min_clean_data_per_recording_s: {value: 60, prov: placeholder, ref: "§12"}
  strict_variant:
    emg_multiple_of_median: {value: 3, prov: locked, ref: "§5.2"}
    rms_max_uv: {value: 100, prov: locked, ref: "§5.2"}
  sensitivity_highpass_hz: {value: 0.1, prov: locked, ref: "§5.1, §5.2"}
  vigilance:
    alpha_band_hz: {value: [8, 13], prov: locked, ref: "§5.1"}
    theta_band_hz: {value: [4, 8], prov: locked, ref: "§5.1"}
    epoch_s: {value: 2, prov: locked, ref: "§5.1"}
  observation_fs_hz: {value: 256, prov: locked, ref: "§5.1, §10.1"}
  noise_adaptive_R: {value: false, prov: locked, ref: "§5.2", note: "hard rejection is the default; §21.2 #1 (open) compares the alternative in the pilot"}

# ---------------------------------------------------------------- rescaling reference (§5.1, §7.6)
rescaling:
  mu_ref: {value: 7.572449764282774, prov: computed, ref: "§5.1", unit: "model output units (mV)", note: "mean of the UNFILTERED simulated y1-y2; written by PLAN.md step A4"}
  sigma_ref: {value: 1.131413384422008, prov: computed, ref: "§5.1", unit: "model output units (mV)", note: "SD of the output after the 0.5-45 Hz band-pass and 256 Hz downsampling; written by step A4"}
  computed_provenance: {value: {"seed": 42, "kept_duration_s": 600, "burn_in_s": 10, "sim_fs_hz": 2048, "observation_fs_hz": 256, "edge_trim_s": 5, "ddof": 1, "n_mu_samples": 1228800, "n_sigma_samples": 151040, "units": "mV (model output units)", "git_commit": "7191d1007dd841e77f44a4932ea3d06c5acf346f", "git_dirty": false, "numpy": "2.5.3", "scipy": "1.18.1", "numba": "0.67.0"}, prov: computed, ref: "§5.1", note: "IMP-005; seed, kept duration, burn-in, rates, trim, ddof, git hash and dirty flag, library versions, units; written together with mu_ref and sigma_ref"}
  reference_simulation:
    p_s_inv: {value: 220, prov: locked, ref: "§5.1"}
    input_noise_uniform_low_s_inv: {value: 120, prov: literature, ref: "§5.1, §7.3"}
    input_noise_uniform_high_s_inv: {value: 320, prov: literature, ref: "§5.1, §7.3"}
    duration_s: {value: 600, prov: locked, ref: "§5.1"}
    sim_fs_hz: {value: 2048, prov: locked, ref: "§5.1"}
    parameters: {value: "standard §7.3 parameters", prov: locked, ref: "§5.1"}
    seed: {value: 42, prov: placeholder, ref: "§5.1", note: "IMP-003; the document gives no seed"}
    burn_in_s: {value: 10, prov: placeholder, ref: "§5.1", note: "IMP-003, IMP-005; excluded from duration_s: 10 s burn-in is simulated first and discarded, then exactly duration_s is kept"}
    node_structure: {value: "single node", prov: placeholder, ref: "§5.1", note: "IMP-003; standard §7.3 parameters, no mixing, no coupling"}
    integrator: {value: "heun", prov: placeholder, ref: "§5.1, §7.6, §9.1", note: "IMP-003; second order, input drawn once per step and held constant within the step"}
    noise_redraw_interval: {value: "every step", prov: placeholder, ref: "§5.1", note: "IMP-003; fresh uniform draw at every 2048-Hz integration step"}
    edge_trim_s: {value: 5, prov: placeholder, ref: "§5.1", unit: "s", note: "IMP-005; trimmed from EACH end of the 256-Hz filtered series before sigma_ref"}
    ddof: {value: 1, prov: placeholder, ref: "§5.1", note: "IMP-005; sample SD; B5's per-recording rescaling must use the same convention"}
    diagnostic_seeds: {value: [43, 44, 45, 46, 47], prov: placeholder, ref: "§5.1", note: "IMP-005; printed spread only, never stored in the constants"}

# ---------------------------------------------------------------- Jansen-Rit constants (§7.3)
jansen_rit:
  A: {value: 3.25, prov: literature, ref: "§7.3", unit: "mV"}
  B: {value: 22.0, prov: literature, ref: "§7.3", unit: "mV"}
  a: {value: 100.0, prov: literature, ref: "§7.3", unit: "1/s"}
  b: {value: 50.0, prov: literature, ref: "§7.3", unit: "1/s"}
  C: {value: 135.0, prov: literature, ref: "§7.3"}
  C1_multiplier: {value: 1.0, prov: literature, ref: "§7.3", note: "C1 = C"}
  C2_multiplier: {value: 0.8, prov: literature, ref: "§7.3", note: "C2 = 0.8*C = 108"}
  C3_multiplier: {value: 0.25, prov: literature, ref: "§7.3", note: "C3 = 0.25*C"}
  C4_multiplier: {value: 0.25, prov: literature, ref: "§7.3", note: "C4 = 0.25*C"}
  e0: {value: 2.5, prov: literature, ref: "§7.3", unit: "1/s", note: "max firing rate is 2*e0 = 5 1/s"}
  v0: {value: 6.0, prov: literature, ref: "§7.3", unit: "mV"}
  r: {value: 0.56, prov: literature, ref: "§7.3", unit: "1/mV"}
  p_mean: {value: 220.0, prov: literature, ref: "§7.3", unit: "1/s", note: "starting value of the ESTIMATED mean input"}
  sigmoid_offset_subtracted: {value: false, prov: locked, ref: "§7.3", note: "S(v) = 2*e0/(1+exp(r*(v0-v))), so S(0) is not 0"}
  observation_output: {value: "y1 - y2", prov: locked, ref: "§7.1"}
  observation_gain: {value: 1.0, prov: locked, ref: "§7.2, §7.4", note: "fixed, not estimated"}

# ---------------------------------------------------------------- simulator numerics (IMP-003)
simulator:
  steady_state_scan_points: {value: 2001, prov: placeholder, ref: "IMP-003", note: "grid over y0 in (0, 2*e0*A/a) scanned for sign changes of the fixed-point residual"}
  steady_state_bisection_iterations: {value: 100, prov: placeholder, ref: "IMP-003"}
  sanity_welch_segment_s: {value: 8, prov: placeholder, ref: "IMP-003", note: "Segment length for the A2 sanity report (test only); also used by the reference-constant alpha-peak diagnostic (IMP-005), which is a periodogram of non-overlapping Hann segments"}

# ---------------------------------------------------------------- coupling and delay (§7.3, §8.1)
coupling:
  delay_ms_nominal: {value: 10.0, prov: placeholder, ref: "§7.3", note: "inter-node delay, both directions, fixed"}
  delay_substeps: {value: 10, prov: placeholder, ref: "§7.5, §7.6", note: "at 1024 Hz effective step this is about 9.77 ms"}
  sim_delay_steps: {value: 20, prov: placeholder, ref: "§7.5, §9.1", note: "IMP-003; simulator delay in 2048-Hz steps = 9.765625 ms, equal to the UKF's 10 sub-steps at 1024 Hz"}
  gain_prior_mean: {value: 0.0, prov: placeholder, ref: "§7.3, §7.6", unit: "1/s"}
  gain_prior_sd_factor_of_C2: {value: 0.1, prov: placeholder, ref: "§7.3, §7.6", note: "SD = 0.1*C2 = 10.8 1/s"}
  common_input_term_in_fitted_model: {value: false, prov: locked, ref: "§7.2"}
  base_form: {value: "sigmoid of delayed pyramidal output, times gain, added inside the p bracket of y4", prov: locked, ref: "§8.1"}

# ---------------------------------------------------------------- observation model and estimated quantities (§7.2, §7.4)
observation:
  mixing_diagonal: {value: 1.0, prov: locked, ref: "§7.2"}
  mixing_symmetric: {value: true, prov: locked, ref: "§7.2"}

state:
  n_neural_states: {value: 12, prov: locked, ref: "§7.1, §7.4"}
  estimated_parameters: {value: [p1, p2, rho1, rho2, g12, g21, m], prov: locked, ref: "§7.4"}
  n_augmented_states: {value: 19, prov: locked, ref: "§7.4"}
  n_augmented_states_M1: {value: 17, prov: locked, ref: "§7.6", note: "M1 removes g12 and g21"}
  reduction_order: {value: [fix_EI_terms, tie_p1_p2, tie_g12_g21], prov: locked, ref: "§7.4", note: "gains and m are never dropped"}
  never_drop: {value: [g12, g21, m], prov: locked, ref: "§7.4"}
  reduction_switches:
    fix_EI_terms: {value: false, prov: locked, ref: "§7.4"}
    tie_p1_p2: {value: false, prov: locked, ref: "§7.4"}
